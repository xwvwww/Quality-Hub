services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quality_hub}
      POSTGRES_USER: ${POSTGRES_USER:-quality_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quality_hub_dev}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    ports: ["4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    command: sh -c "pnpm --filter backend prisma:deploy && pnpm --filter backend prisma:seed && pnpm --filter backend start:prod"
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
  redis_data:
  minio_data:
